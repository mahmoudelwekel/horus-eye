name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Read app version
        id: meta
        run: |
          VERSION=$(jq -r .version webos-camera-app/appinfo.json)
          APP_ID=$(jq -r .id webos-camera-app/appinfo.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipk=${APP_ID}_${VERSION}_all.ipk" >> "$GITHUB_OUTPUT"

      - name: Build IPK
        run: |
          mkdir -p out
          ares-package webos-camera-app -o out
          ls -l out

      # Homebrew Channel (webosbrew) repository files. Add this URL in Homebrew Channel:
      #   https://github.com/<owner>/<repo>/releases/latest/download/apps.json
      - name: Generate Homebrew Channel manifest and index
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          IPK: ${{ steps.meta.outputs.ipk }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const { REPO, TAG, IPK } = process.env;
          const app = JSON.parse(fs.readFileSync('webos-camera-app/appinfo.json', 'utf8'));
          const ipk = fs.readFileSync(`out/${IPK}`);
          const base = `https://github.com/${REPO}`;
          const iconUri = `https://raw.githubusercontent.com/${REPO}/master/webos-camera-app/largeIcon.png`;
          const description = 'Watch home CCTV/NVR cameras on your TV through a local go2rtc bridge.';
          const manifest = {
            id: app.id,
            version: app.version,
            type: app.type,
            title: app.title,
            appDescription: description,
            iconUri,
            sourceUrl: base,
            rootRequired: false,
            ipkUrl: `${base}/releases/download/${TAG}/${IPK}`,
            ipkHash: { sha256: crypto.createHash('sha256').update(ipk).digest('hex') },
            ipkSize: ipk.length,
          };
          const index = {
            paging: { page: 1, count: 1, maxPage: 1, itemsTotal: 1, prevUrl: null, nextUrl: null },
            packages: [{
              id: app.id,
              title: app.title,
              iconUri,
              manifestUrl: `${base}/releases/download/${TAG}/manifest.json`,
              manifest,
              pool: 'main',
              category: 'multimedia',
              shortDescription: description,
            }],
          };
          fs.writeFileSync('out/manifest.json', JSON.stringify(manifest, null, 2));
          fs.writeFileSync('out/apps.json', JSON.stringify(index, null, 2));
          JS
          cat out/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IPK: out/${{ steps.meta.outputs.ipk }}
        run: |
          ASSETS=("$IPK" out/manifest.json out/apps.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version already released: refresh the assets so the release matches master.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Updated assets on existing release $TAG (bump version in appinfo.json for a new release)."
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Horus Eye $TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
